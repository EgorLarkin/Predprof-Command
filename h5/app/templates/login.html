{% extends "base.html" %}
{% block title %}Вход — AlienSignal AI{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-satellite-dish fa-3x text-primary mb-3"></i>
                    <h3>Вход в систему</h3>
                    <p class="text-muted">Классификатор сигналов инопланетных цивилизаций</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user me-1"></i>Логин
                        </label>
                        <input type="text" class="form-control form-control-lg" 
                               id="username" name="username" required autofocus
                               placeholder="Введите логин">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-1"></i>Пароль
                        </label>
                        <input type="password" class="form-control form-control-lg" 
                               id="password" name="password" required
                               placeholder="Введите пароль">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>Войти
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
