<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>МЕЖПЛАНЕТНЫЙ КОНТАКТ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            font-weight: bold;
            min-height: 100vh;
            background: linear-gradient(180deg, #0a1628, #1e3a5f, #4a90e2);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            position: relative;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 1000;
            align-items: center;
        }

        .nav-btn {
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            text-decoration: none;
            font-weight: 800;
            text-align: center;
            display: inline-block;
        }

        .nav-btn.admin {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #0a1628;
            border: none;
        }
        .nav-btn.admin:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .nav-btn.logout {
            background: linear-gradient(135deg, #ff6b6b, #ce3e3e);
            color: white;
            border: none;
        }
        .nav-btn.logout:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .user-label {
            color: #a8d8ff;
            font-size: 0.9rem;
            margin-right: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header {
            width: 100%;
            padding: 30px;
            text-align: center;
            background: rgba(69, 38, 119, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { text-transform: uppercase; letter-spacing: 2px; color: #a8d8ff; }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            gap: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #fileInput { display: none; }
        
        .custom-btn {
            padding: 18px 50px;
            font-size: 1.1rem;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            text-transform: uppercase;
            white-space: nowrap; 
            width: 100%;
            max-width: 300px;
            text-align: center;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .custom-btn:hover {
            opacity: 0.9;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }
        .custom-btn:active { transform: translateY(0); }
        
        .btn-select { 
            background: linear-gradient(135deg, #667eea, #764ba2); 
        }
        
        .btn-submit { 
            background: linear-gradient(135deg, #11998e, #38ef7d); 
        }
        
        .file-name { color: #a8d8ff; min-height: 1.5em; }

        #analyticsSection { display: none; width: 100%; flex-direction: column; gap: 20px; }
        .status-message { 
            text-align: center;
            color: #38ef7d;
            font-size: 1.2rem;
            background: rgba(56, 239, 125, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 239, 125, 0.3);
            font-weight: 800;
            text-transform: uppercase;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }
        @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            height: 320px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }
        .chart-title { 
            text-align: center; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            font-size: 0.9rem;
            flex-shrink: 0;
            color: #a8d8ff;
            letter-spacing: 1px;
        }
        .canvas-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    
    <div class="top-bar">
        <span class="user-label">{{ username }}</span>
        {% if is_admin %}
            <a href="/admin" class="nav-btn admin">⚙️ Админка</a>
        {% endif %}
        <a href="/logout" class="nav-btn logout">Выйти</a>
    </div>

    <div class="header"><h1>🛸 Межпланетный Контакт</h1></div>

    <div class="main-content">
        <form id="uploadForm">
            <input type="file" name="file" id="fileInput" accept="audio/*">
            <label for="fileInput" class="custom-btn btn-select">📁 Загрузить файл</label>
            <div class="file-name" id="fileName">Файл не загружен</div>
            <button type="submit" class="custom-btn btn-submit">🚀 Отправить</button>
        </form>

        <div id="analyticsSection">
            <div class="status-message" id="statusMessage"></div>
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-title">Вероятности</div>
                    <div class="canvas-wrapper">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">Спектр</div>
                    <div class="canvas-wrapper">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const form = document.getElementById('uploadForm');
        const analyticsSection = document.getElementById('analyticsSection');
        const statusMessage = document.getElementById('statusMessage');
        let chart1, chart2;

        fileInput.onchange = () => {
            fileName.textContent = fileInput.files[0] ? fileInput.files[0].name : 'Not loaded file';
        };

        form.onsubmit = async (e) => {
            e.preventDefault();
            if (!fileInput.files.length) return alert('Выберите файл!');

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.success) {
                analyticsSection.style.display = 'flex';
                statusMessage.textContent = `Обработан: ${data.filename}`;
                drawCharts(data.analytics);
            }
        };

        function drawCharts(data) {
            if (chart1) chart1.destroy();
            if (chart2) chart2.destroy();

            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 10, bottom: 10, left: 10, right: 10 } }
            };

            chart1 = new Chart(document.getElementById('pieChart'), {
                type: 'doughnut',
                data: {
                    labels: data.labels,
                    datasets: [{ 
                        data: data.probabilities, 
                        backgroundColor: ['#667eea', '#764ba2', '#11998e', '#38ef7d'], 
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    ...commonOptions,
                    plugins: { legend: { position: 'bottom', labels: { color: '#fff', font: { size: 10 }, padding: 15 } } }
                }
            });

            chart2 = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: {
                    labels: data.frequencies.map(f => f + 'Hz'),
                    datasets: [{ 
                        label: 'Интенсивность', 
                        data: data.intensities, 
                        backgroundColor: 'rgba(56, 239, 125, 0.6)', 
                        borderColor: '#38ef7d', 
                        borderWidth: 1,
                        barThickness: 'flex',
                        maxBarThickness: 30
                    }]
                },
                options: {
                    ...commonOptions,
                    scales: { 
                        y: { beginAtZero: true, ticks: { color: '#ccc', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.1)' }, border: { display: false } }, 
                        x: { ticks: { display: false }, grid: { display: false }, border: { display: false }, offset: true } 
                    }, 
                    plugins: { legend: { display: false }, tooltip: { enabled: true } }
                }
            });
        }
    </script>
</body>
</html>
