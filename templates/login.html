<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: linear-gradient(180deg, #0a1628, #1e3a5f, #4a90e2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .auth-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .auth-box h2 { text-transform: uppercase; letter-spacing: 1px; color: #a8d8ff; }
        
        input {
            width: 100%;
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            outline: none;
            font-size: 1rem;
        }
        input::placeholder { color: #aaa; }
        input:focus { border-color: #38ef7d; }

        .custom-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .custom-btn:hover {
            opacity: 0.9;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .flash {
            padding: 12px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .flash.error { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; border: 1px solid #ff6b6b; }
        .flash.success { background: rgba(56, 239, 125, 0.2); color: #38ef7d; border: 1px solid #38ef7d; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>Вход в систему</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="text" name="username" placeholder="Логин" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit" class="custom-btn">Войти</button>
        </form>
    </div>
</body>
</html>
